
collection: Eval Repair Fixtures
description: Deliberately broken playbooks -- the before-state of a repair task.
visible: true

playbooks:
  - name: Phishing Sender IP Block With Approval
    description: Score a sender IP, block it when its reputation is high.
    steps:
      - name: On Phishing Alert
        type: start_on_create
        next: Score Sender IP
        module: alerts
        when:
          logic: AND
          filters:
            - field: recordTags
              op: in
              value: ["/api/3/tags/phishing"]

      - name: Score Sender IP
        type: connector
        next: Reputation Gate
        connector: virustotal
        operation: query_ip
        config: ""
        params:
          ip: "{{ vars.input.records[0].iPAddresses[0] }}"

      - name: Reputation Gate
        type: decision
        conditions:
          - display: Malicious
            when: "{{ vars.steps.Score_Sender_IP.data.reputation > 50 }}"
            next: Block Sender IP
          - display: Clean
            default: true
            next: Comment On Alert

      - name: Block Sender IP
        type: connector
        next: Comment On Alert
        connector: fortigate-firewall
        operation: block_ip_new
        config: ""
        params:
          method: Quarantine Based
          ip_addresses: "{{ vars.input.records[0].iPAddresses[0] }}"

      - name: Comment On Alert
        type: create_record
        next: Done
        module: comments
        operation: Overwrite
        fields:
          content: >-
            Scored sender IP, reputation {{ vars.steps.Score_Sender_IP.data.reputation }}.
          alerts: "{{ vars.input.records[0]['@id'] }}"

      - name: Done
        type: end
