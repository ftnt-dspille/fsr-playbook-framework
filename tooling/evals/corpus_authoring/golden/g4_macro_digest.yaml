collection: Golden - Macro Digest
description: Read the macro list, then record a digest of it on an alert.
visible: true
playbooks:
  - name: Macro Digest
    description: Call a utility op and write a readable digest of its output.
    is_active: true
    steps:
      - name: Start
        type: start
        next: Get Macros
      - name: Get Macros
        type: connector
        connector: cyops_utilities
        operation: get_macro_list
        config: ""
        params: {}
        next: Record Digest
      - name: Record Digest
        type: create_record
        module: alerts
        resource:
          name: Macro digest
          severity: Low
          description: "{{ vars.steps.Get_Macros.data | join(', ') }}"
