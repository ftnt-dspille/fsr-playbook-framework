# Sample playbooks for the microsoft-purview-ediscovery connector (v1.0.0) --
# the M365 scenario set, written in the fortinet-fortiaigate style:
# scenario-grouped YAML source of truth, compiled by build.py, with a
# mock_result on every step that would otherwise need the connector configured.
#
# Why mock_result on every connector step: a playbook whose steps all carry a
# mock_result runs end-to-end on an appliance WITHOUT the connector configured
# (`fsrpb run-playbook <name> --mock`), and offline in the framework repo's
# step-through simulator. Every mock payload is the op's raw return shape
# (source-derived from the connector's operations.py v1.0.0 and the Graph v1.0
# security resource shapes), wrapped in the production
# {data, status, message, operation} envelope so the playbook's
# vars.steps.<step>.data.<field> references render the same way live and under
# --mock. Payloads are sanitized synthetic shapes (all-zero GUID ids,
# @contoso.example users, contoso.example download URLs); when a real tenant
# capture lands, promote it into the mock block unchanged.
#
# Requires alongside this connector on the appliance: nothing for the mock run;
# live runs need the connector configured with an app registration holding
# eDiscovery.ReadWrite.All (admin consented) and a tenant licensed for
# Microsoft Purview eDiscovery (Premium), plus the roles the case workflow
# needs (eDiscovery Manager with case management).

collection: Sample - Microsoft Purview eDiscovery - 1.0.0
description: >-
  Sample playbooks for the "Microsoft Purview eDiscovery" connector. If you are
  planning to use the sample playbooks in your environment, ensure that you
  clone those playbooks and move them to a different collection, since the
  sample playbook collection gets deleted during connector upgrade and delete.
visible: true
tags:
  - microsoft-purview-ediscovery
  - Microsoft
  - ediscovery

playbooks:

  # - Scenario D (flagship) - eDiscovery multi mailbox search and triage:
  #   a case is found or opened, the reported users become held custodians,
  #   a KQL search runs over their mailboxes, the estimate is waited for, and
  #   a human chooses the response (soft purge, hard purge, export or keep)
  #   through a manual-input card before anything destructive happens. -------

  - name: EDiscovery Multi Mailbox Search and Triage
    description: >-
      One playbook for the "these mailboxes may hold the phishing campaign"
      report: it finds or opens the Purview eDiscovery case by name, adds the
      reported users as custodians with legal hold, adds each new custodian's
      mailbox and OneDrive as data sources, creates the KQL search over those
      sources, waits for the estimate statistics to finish, and then asks a
      human to choose the response through a manual-input card that shows
      exactly how many items matched. Soft purge moves the matched items to
      the recoverable items folder, hard purge deletes them permanently,
      export packages them for download, and "no action" keeps the case and
      the search for review in the Purview portal. The search created by this
      run is deleted again on the way out (a reused search is kept), and the
      run's outcome is written back onto the reported incident when one was
      supplied.

      Why find-or-create on both the case and the search: re-runs over the
      same incident must not pile up duplicate cases or duplicate searches.
      Both adopt an existing resource by exact display name first and record
      whether this run created it; the cleanup step only deletes a search this
      run created, so a pre-existing search definition survives every run.

      Why create_custodians (the bulk op) instead of one call per user: the
      op matches each address against the case's existing custodians first,
      so a re-run reports those as already present instead of failing on the
      duplicate, and one bad address never aborts the batch - its failure is
      captured on that address's own result row.

      Why the estimate runs through wait_for_search_statistics: a fresh
      search has no statistics until an estimateStatistics action finishes,
      and the counts are the whole point of the triage - the op kicks the
      estimate when the search has none and polls until it is done, so the
      card never shows zeros from an estimate that is still running.

      Inputs: case_name (the eDiscovery case to find or open - default
      "Phishing incident response"), user_upns (comma-separated custodian
      UPNs, which are their SMTP addresses in the common case - default
      alice@contoso.example, bob@contoso.example), kql_query (the Keyword
      Query Language search - default subject:"payroll update", the same
      campaign the Purge Reported Phishing Mail scenario sweeps for),
      search_display_name (the search to find or create; the default adds a
      timestamp so concurrent runs never collide), purge_choice (soft, hard,
      export or none - a preselected choice for unattended runs; none, the
      default, asks the analyst), incident_id (optional FortiSOAR incident id
      to write the outcome back onto), approver (Teams recipient for the
      response card - default soc-oncall@contoso.example). Outputs: outcome
      (purged_recoverable, purged_permanent, exported, no_action or no_hits),
      case_id, case_auto_created, search_id, search_auto_created, action,
      indexed_items, unindexed_items, total_items, mailboxes, sites,
      operation_id, export_files, download_url.

      Live prerequisites: the connector configured with eDiscovery.ReadWrite.
      All admin consented and a tenant licensed for Purview eDiscovery
      (Premium); the run needs the case-management role for create_case. The
      manual-input card is delivered through the "Microsoft Teams" external
      channel (the wiring the FortiSOAR-for-Microsoft-Teams solution pack
      uses); the picklist IRI is tenant-local, so it is selected on the
      prompt after cloning - the choice routing itself is channel-agnostic.
    is_active: true
    debug: true
    parameters: [approver, case_name, user_upns, kql_query, search_display_name, purge_choice, incident_id]
    steps:

      - name: Start
        type: start
        module: incidents
        requires_record: false
        button_label: Run eDiscovery Triage
        inputVariables:
          - {name: approver, type: string, label: Approver}
          - {name: case_name, type: string, label: Case Name}
          - {name: user_upns, type: string, label: User UPNs}
          - {name: kql_query, type: string, label: KQL Query}
          - {name: search_display_name, type: string, label: Search Display Name}
          - {name: purge_choice, type: string, label: Purge Choice}
          - {name: incident_id, type: string, label: Incident ID}
        next: Resolve Inputs

      # Scheduled runs bind no playbook parameters, so every input resolves
      # through a default chain: manual/API-run parameter -> top-level trigger
      # variable -> the sanitized default. The search display name's default
      # gets its timestamp in the Stamp Search Name step that follows, not
      # here: get_current_datetime is an FSR global the offline renderer does
      # not know, and a template that mentions it fails to render as a whole -
      # which would silently discard a bound input value along with the
      # default. Keeping the global in its own variable isolates it.
      - name: Resolve Inputs
        type: set_variable
        next: Stamp Search Name
        vars:
          approver: "{{ vars.input.params.approver | default(vars.approver, true) | default('soc-oncall@contoso.example', true) }}"
          case_name: "{{ vars.input.params.case_name | default(vars.case_name, true) | default('Phishing incident response', true) }}"
          user_upns: "{{ vars.input.params.user_upns | default(vars.user_upns, true) | default('alice@contoso.example, bob@contoso.example', true) }}"
          kql_query: "{{ vars.input.params.kql_query | default(vars.kql_query, true) | default('subject:\"payroll update\"', true) }}"
          search_display_name: "{{ vars.input.params.search_display_name | default(vars.search_display_name, true) | default('', true) }}"
          search_name_stamp: "{{ get_current_datetime() }}"
          purge_choice: "{{ vars.input.params.purge_choice | default(vars.purge_choice, true) | default('none', true) }}"
          incident_id: "{{ vars.input.params.incident_id | default(vars.incident_id, true) | default('', true) }}"

      # The timestamp default: a caller-supplied name wins, otherwise the run
      # stamps one so concurrent runs never adopt each other's search by
      # accident. Offline the stamp variable carries the raw template text
      # (the renderer has no get_current_datetime); live it carries the run
      # time - both render a name no existing search is called, which is the
      # point.
      - name: Stamp Search Name
        type: set_variable
        next: List Cases
        vars:
          search_display_name: "{{ (vars.search_display_name | default('', true)) or ('Phishing incident response - search ' ~ vars.search_name_stamp) }}"

      - name: List Cases
        type: connector
        next: Find Case
        comment: >-
          Every case, all pages. The match below is by exact display name, so
          the list has to be complete for the find-or-create to be safe.
        connector: microsoft-purview-ediscovery
        operation: list_cases
        config: ''
        params: {}
        mock_result:
          data:
            items:
              - "@odata.type": microsoft.graph.security.ediscoveryCase
                id: 00000000-0000-0000-0000-00000000c002
                displayName: Quarterly audit hold
                description: Standing legal hold for the quarterly audit.
                status: active
                createdDateTime: '2026-11-03T08:00:00.0000000Z'
                lastModifiedDateTime: '2026-11-20T14:12:00.0000000Z'
              - "@odata.type": microsoft.graph.security.ediscoveryCase
                id: 00000000-0000-0000-0000-00000000c003
                displayName: HR investigation 2026
                description: HR investigation into data exfiltration.
                status: active
                createdDateTime: '2026-11-10T10:00:00.0000000Z'
                lastModifiedDateTime: '2026-11-21T09:00:00.0000000Z'
            count: 2
            pages: 1
          status: success
          message: ''
          operation: list_cases

      # Exact display-name match; a closed case with the same name would be
      # adopted here and then fail downstream (Purview rejects changes to
      # closed cases) - the failure is the readable signal to reopen it.
      - name: Find Case
        type: set_variable
        next: Case Exists
        comment: >-
          Bracket access for the items key: a bare .items resolves to the
          dict method of the same name and the render dies on it.
        vars:
          case_id: "{{ ((vars.steps.List_Cases.data['items'] | default([], true)) | selectattr('displayName', 'equalto', vars.case_name) | list | first | default(none, true)).id | default('', true) }}"

      - name: Case Exists
        type: decision
        conditions:
          - display: Case found
            when: "{{ vars.case_id | default('', true) | length > 0 }}"
            next: Adopt Case
          - display: Create a new case
            default: true
            next: Create Case

      - name: Adopt Case
        type: set_variable
        next: Add Custodians
        comment: >-
          The case already exists; this run must not close or delete it, only
          work inside it. case_auto_created stays false so the close-out can
          say the case was reused.
        vars:
          case_auto_created: false

      - name: Create Case
        type: connector
        next: Case Created
        connector: microsoft-purview-ediscovery
        operation: create_case
        config: ''
        params:
          display_name: '{{ vars.case_name }}'
          description: >-
            Opened by the EDiscovery Multi Mailbox Search and Triage playbook
            for query {{ vars.kql_query }}.
        mock_result:
          data:
            "@odata.type": microsoft.graph.security.ediscoveryCase
            id: 00000000-0000-0000-0000-00000000c009
            displayName: Phishing incident response
            description: >-
              Opened by the EDiscovery Multi Mailbox Search and Triage
              playbook for query subject:"payroll update".
            status: active
            createdDateTime: '2026-11-25T09:31:00.0000000Z'
            lastModifiedDateTime: '2026-11-25T09:31:00.0000000Z'
          status: success
          message: ''
          operation: create_case

      - name: Case Created
        type: set_variable
        next: Add Custodians
        vars:
          case_id: '{{ vars.steps.Create_Case.data.id }}'
          case_auto_created: true

      # One bulk call for every reported address: the op matches each address
      # against the case's existing custodians (re-runs report exists instead
      # of failing), starts the hold on every custodian it creates, and never
      # aborts the batch on one bad address - the failure rides on that
      # address's own result row.
      - name: Add Custodians
        type: connector
        next: Create Mailbox Sources
        comment: >-
          A custodian UPN is their SMTP address in the common case; for
          tenants where the UPN differs from the mailbox address, pass the
          SMTP addresses. apply_hold_to_sources starts the legal hold with the
          creation, which is what a phishing triage wants - the evidence must
          not be auto-deleted by retention while the search runs.
        connector: microsoft-purview-ediscovery
        operation: create_custodians
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          emails: '{{ vars.user_upns }}'
          apply_hold_to_sources: true
        mock_result:
          data:
            case_id: 00000000-0000-0000-0000-00000000c009
            requested: 2
            created_count: 2
            exists_count: 0
            failed_count: 0
            results:
              - email: alice@contoso.example
                custodian_id: 00000000-0000-0000-0000-00000000d001
                status: created
              - email: bob@contoso.example
                custodian_id: 00000000-0000-0000-0000-00000000d002
                status: created
            custodian_ids: 00000000-0000-0000-0000-00000000d001,00000000-0000-0000-0000-00000000d002
          status: success
          message: ''
          operation: create_custodians

      # A brand-new custodian has no data sources yet, so the search below
      # would bind nothing and silently match zero items. One userSource
      # (mailbox + OneDrive) per custodian THIS CALL created; a custodian the
      # case already had keeps the sources it already has. The loop's output
      # is deliberately not read downstream - create_search resolves each
      # custodian's sources from the custodian ids itself. A failed source
      # here fails the run loudly: binding nothing would look exactly like a
      # clean search with no hits.
      - name: Create Mailbox Sources
        type: connector
        next: List Searches
        connector: microsoft-purview-ediscovery
        operation: create_custodian_user_source
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          custodian_id: '{{ vars.item.custodian_id }}'
          email: '{{ vars.item.email }}'
        for_each:
          item: "{{ (vars.steps.Add_Custodians.data.results | default([], true)) | selectattr('status', 'equalto', 'created') | list }}"
        mock_result:
          data:
            "@odata.type": microsoft.graph.security.userSource
            id: 00000000-0000-0000-0000-00000000e001
            email: alice@contoso.example
            displayName: Alice mailbox
            holdStatus: notApplied
            includedSources: mailbox, site
            createdDateTime: '2026-11-25T09:32:00.0000000Z'
          status: success
          message: ''
          operation: create_custodian_user_source

      - name: List Searches
        type: connector
        next: Find Search
        connector: microsoft-purview-ediscovery
        operation: list_searches
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
        mock_result:
          data:
            items:
              - id: 00000000-0000-0000-0000-00000000f101
                displayName: Search One
                description: Sweep for the quarterly audit hold.
                contentQuery: subject:"Quarterly Financials"
                dataSourceScopes: none
                createdDateTime: '2026-11-12T11:00:00.0000000Z'
                lastModifiedDateTime: '2026-11-12T11:05:00.0000000Z'
              - id: 00000000-0000-0000-0000-00000000f102
                displayName: Search Two
                description: Tenant-wide malware attachment sweep.
                contentQuery: attachments:virus
                dataSourceScopes: allTenantMailboxes
                createdDateTime: '2026-11-14T15:30:00.0000000Z'
                lastModifiedDateTime: '2026-11-14T15:31:00.0000000Z'
            count: 2
            pages: 1
          status: success
          message: ''
          operation: list_searches

      - name: Find Search
        type: set_variable
        next: Search Exists
        comment: >-
          Bracket access for the items key: a bare .items resolves to the
          dict method of the same name and the render dies on it.
        vars:
          search_id: "{{ ((vars.steps.List_Searches.data['items'] | default([], true)) | selectattr('displayName', 'equalto', vars.search_display_name) | list | first | default(none, true)).id | default('', true) }}"

      - name: Search Exists
        type: decision
        conditions:
          - display: Search found
            when: "{{ vars.search_id | default('', true) | length > 0 }}"
            next: Adopt Search
          - display: Create a new search
            default: true
            next: Create Search

      - name: Adopt Search
        type: set_variable
        next: Wait For Statistics
        comment: >-
          A search with this exact name already exists in the case - reuse it
          and its query as-is. search_auto_created stays false, which is what
          keeps the cleanup step from deleting it at the end of the run.
        vars:
          search_auto_created: false

      - name: Create Search
        type: connector
        next: Search Created
        comment: >-
          dataSourceScopes none: the search must look at EXACTLY the
          custodian sources bound below, not all case custodians or the whole
          tenant. The connector expands each custodian id to that custodian's
          existing userSources and siteSources and binds them through
          custodianSources@odata.bind.
        connector: microsoft-purview-ediscovery
        operation: create_search
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          display_name: '{{ vars.search_display_name }}'
          description: >-
            Triage search opened by the EDiscovery Multi Mailbox Search and
            Triage playbook (query: {{ vars.kql_query }}).
          content_query: '{{ vars.kql_query }}'
          data_source_scopes: none
          custodian_ids: "{{ (vars.steps.Add_Custodians.data.results | default([], true)) | map(attribute='custodian_id') | select | join(',') }}"
        mock_result:
          data:
            search:
              id: 00000000-0000-0000-0000-00000000f103
              displayName: Phishing incident response - search 2026-11-25 09:31:00
              description: >-
                Triage search opened by the EDiscovery Multi Mailbox Search
                and Triage playbook (query: subject:"payroll update").
              contentQuery: subject:"payroll update"
              dataSourceScopes: none
              createdDateTime: '2026-11-25T09:33:00.0000000Z'
              lastModifiedDateTime: '2026-11-25T09:33:00.0000000Z'
            additional_sources: []
          status: success
          message: ''
          operation: create_search

      - name: Search Created
        type: set_variable
        next: Wait For Statistics
        vars:
          search_id: '{{ vars.steps.Create_Search.data.search.id }}'
          search_auto_created: true

      # The counts the whole triage hangs on: a fresh search has no
      # statistics until its estimateStatistics action finishes, so the op
      # kicks the estimate itself when the search has none and polls through
      # the lastEstimateStatisticsOperation expansion until it is done.
      - name: Wait For Statistics
        type: connector
        next: Statistics Summary
        connector: microsoft-purview-ediscovery
        operation: wait_for_search_statistics
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
          timeout_seconds: 300
        mock_result:
          data:
            case_id: 00000000-0000-0000-0000-00000000c009
            search_id: 00000000-0000-0000-0000-00000000f103
            estimated: true
            kicked: true
            elapsed_seconds: 20.0
            operation:
              id: 00000000-0000-0000-0000-00000000f201
              action: estimateStatistics
              status: succeeded
              percentProgress: 100
              statisticsOptions: includeRefiners, includeQueryStats, includeUnindexedStats, locationsWithoutHits
              indexedItemCount: 128
              indexedItemsSize: 134217728
              unindexedItemCount: 4
              unindexedItemsSize: 1048576
              mailboxCount: 2
              siteCount: 0
              createdDateTime: '2026-11-25T09:33:10.0000000Z'
              completedDateTime: '2026-11-25T09:33:30.0000000Z'
            lastEstimateStatistics:
              indexedItemCount: 128
              indexedItemsSize: 134217728
              unindexedItemCount: 4
              unindexedItemsSize: 1048576
              mailboxCount: 2
              siteCount: 0
          status: success
          message: ''
          operation: wait_for_search_statistics

      # The text the response card shows, plus the numbers the close-out
      # carries. Defaults keep a statistics block that came back empty from
      # rendering as "None items" - it renders as a zero-hit search instead.
      - name: Statistics Summary
        type: set_variable
        next: Hits Found
        vars:
          indexed_items: "{{ vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.indexedItemCount | default(0, true) }}"
          unindexed_items: "{{ vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.unindexedItemCount | default(0, true) }}"
          total_items: "{{ (vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.indexedItemCount | default(0, true)) + (vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.unindexedItemCount | default(0, true)) }}"
          total_size_mb: "{{ ((vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.indexedItemsSize | default(0, true)) + (vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.unindexedItemsSize | default(0, true))) / 1048576 | round(2) }}"
          mailbox_count: "{{ vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.mailboxCount | default(0, true) }}"
          site_count: "{{ vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.siteCount | default(0, true) }}"
          stats_summary: >-
            Search "{{ vars.search_display_name }}" matched
            {{ vars.total_items }} item(s) (indexed {{ vars.indexed_items }},
            unindexed {{ vars.unindexed_items }}, about
            {{ vars.total_size_mb }} MB) across {{ vars.mailbox_count }}
            mailbox(es) and {{ vars.site_count }} site(s).

      - name: Hits Found
        type: decision
        conditions:
          - display: Hits found
            when: "{{ (vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.indexedItemCount | default(0, true)) + (vars.steps.Wait_For_Statistics.data.lastEstimateStatistics.unindexedItemCount | default(0, true)) > 0 }}"
            next: Response Mode
          - display: No hits
            default: true
            next: Mark No Hits

      # An unattended run preselects the response through the purge_choice
      # input (soft, hard or export); only a run that left it at none reaches
      # the analyst card.
      - name: Response Mode
        type: decision
        conditions:
          - display: Preselected soft purge
            when: "{{ vars.purge_choice | default('none', true) == 'soft' }}"
            next: Soft Purge
          - display: Preselected hard purge
            when: "{{ vars.purge_choice | default('none', true) == 'hard' }}"
            next: Hard Purge
          - display: Preselected export
            when: "{{ vars.purge_choice | default('none', true) == 'export' }}"
            next: Export Results
          - display: Ask the analyst
            default: true
            next: Analyst Gate

      # The destructive-action gate. The card is delivered through the
      # "Microsoft Teams" external channel and the conversation is resolved
      # from the approver parameter (the wiring the
      # FortiSOAR-for-Microsoft-Teams solution pack uses). The channel
      # picklist IRI is the platform-seeded UUID the Teams connector's own
      # playbooks ship; the choice routing itself travels as each option's
      # step_iri, which is channel-agnostic. The description leads with the
      # statistics summary so the choice is made against the real counts.
      - name: Analyst Gate
        type: manual_input
        options:
          - display: soft purge
            primary: true
            next: Soft Purge
          - display: hard purge
            next: Hard Purge
          - display: export
            next: Export Results
          - display: no action
            next: No Action
        title: "Choose the response for '{{ vars.search_display_name }}' ({{ vars.total_items }} items)"
        description: >-
          {{ vars.stats_summary }}<br><br>
          Case "{{ vars.case_name }}" ({{ vars.case_id }}), query
          {{ vars.kql_query }}. Choose the response:<br>
          <b>soft purge</b> - matched items move to the mailbox's recoverable
          items folder (recoverable during the retention window);<br>
          <b>hard purge</b> - matched items are permanently deleted (Teams
          messages are always permanently deleted);<br>
          <b>export</b> - the matched items are packaged for download
          (PST);<br>
          <b>no action</b> - the case and the search stay as they are for
          review in the Purview portal.<br><br>
          At most 100 items per location are purged, and the search itself is
          removed again on the way out unless it existed before this run.
        owner_detail:
          isAssigned: false
          externalRecipients: "{{ vars.approver }}"
        inputInternalUsers: true
        inline_channel_list:
          # External Channel picklist item "Microsoft Teams".
          - /api/3/picklists/c7c35e25-9c26-4a43-a984-4f57d2027111
        unauthenticated_input: true

      # Soft purge - recoverable. The purge answers 202 with an operation
      # resource; the wait op polls it to succeeded or failed so the close-out
      # never reports a purge that is still running (or one that failed).
      - name: Soft Purge
        type: connector
        next: Wait Soft Purge
        connector: microsoft-purview-ediscovery
        operation: purge_data
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
          purge_type: recoverable
          purge_areas: mailboxes
        mock_result:
          data:
            id: 00000000-0000-0000-0000-00000000f202
            action: purgeData
            status: running
            percentProgress: 10
            createdDateTime: '2026-11-25T09:35:00.0000000Z'
            status_code: 202
          status: success
          message: ''
          operation: purge_data

      - name: Wait Soft Purge
        type: connector
        next: Mark Soft Purge
        connector: microsoft-purview-ediscovery
        operation: wait_for_operation
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          operation_id: '{{ vars.steps.Soft_Purge.data.id }}'
          timeout_seconds: 240
        mock_result:
          data:
            case_id: 00000000-0000-0000-0000-00000000c009
            operation_id: 00000000-0000-0000-0000-00000000f202
            elapsed_seconds: 20.0
            polls: 2
            operation:
              id: 00000000-0000-0000-0000-00000000f202
              action: purgeData
              status: succeeded
              percentProgress: 100
              createdDateTime: '2026-11-25T09:35:00.0000000Z'
              completedDateTime: '2026-11-25T09:35:20.0000000Z'
          status: success
          message: ''
          operation: wait_for_operation

      - name: Mark Soft Purge
        type: set_variable
        next: Cleanup Search
        vars:
          branch_outcome: purged_recoverable
          action: soft purge (recoverable items folder)
          operation_id: '{{ vars.steps.Soft_Purge.data.id }}'
          export_files: ''
          download_url: ''

      # Hard purge - permanent. Teams messages are permanently deleted for
      # both purge types; this branch is the one that also removes the
      # Exchange copies beyond recovery.
      - name: Hard Purge
        type: connector
        next: Wait Hard Purge
        connector: microsoft-purview-ediscovery
        operation: purge_data
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
          purge_type: permanentlyDelete
          purge_areas: mailboxes
        mock_result:
          data:
            id: 00000000-0000-0000-0000-00000000f204
            action: purgeData
            status: running
            percentProgress: 10
            createdDateTime: '2026-11-25T09:35:00.0000000Z'
            status_code: 202
          status: success
          message: ''
          operation: purge_data

      - name: Wait Hard Purge
        type: connector
        next: Mark Hard Purge
        connector: microsoft-purview-ediscovery
        operation: wait_for_operation
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          operation_id: '{{ vars.steps.Hard_Purge.data.id }}'
          timeout_seconds: 240
        mock_result:
          data:
            case_id: 00000000-0000-0000-0000-00000000c009
            operation_id: 00000000-0000-0000-0000-00000000f204
            elapsed_seconds: 20.0
            polls: 2
            operation:
              id: 00000000-0000-0000-0000-00000000f204
              action: purgeData
              status: succeeded
              percentProgress: 100
              createdDateTime: '2026-11-25T09:35:00.0000000Z'
              completedDateTime: '2026-11-25T09:35:20.0000000Z'
          status: success
          message: ''
          operation: wait_for_operation

      - name: Mark Hard Purge
        type: set_variable
        next: Cleanup Search
        vars:
          branch_outcome: purged_permanent
          action: hard purge (permanently deleted)
          operation_id: '{{ vars.steps.Hard_Purge.data.id }}'
          export_files: ''
          download_url: ''

      # Export - non-destructive. The export package carries the matched
      # items (PST for mail); the operation's exportFileMetadata lists the
      # download files once the export has completed, which is what the wait
      # op returns.
      - name: Export Results
        type: connector
        next: Wait For Export
        connector: microsoft-purview-ediscovery
        operation: export_result
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
          display_name: 'Export of {{ vars.search_display_name }}'
          description: >-
            Export of the triage search results for case
            {{ vars.case_name }} (query: {{ vars.kql_query }}).
          export_format: pst
          export_location: responsiveLocations
        mock_result:
          data:
            id: 00000000-0000-0000-0000-00000000f203
            action: exportResult
            status: running
            percentProgress: 0
            displayName: Export of Phishing incident response
            exportFormat: pst
            exportLocation: responsiveLocations
            cloudAttachmentVersion: latest
            documentVersion: latest
            createdDateTime: '2026-11-25T09:36:00.0000000Z'
            status_code: 202
          status: success
          message: ''
          operation: export_result

      - name: Wait For Export
        type: connector
        next: Record Export
        connector: microsoft-purview-ediscovery
        operation: wait_for_operation
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          operation_id: '{{ vars.steps.Export_Results.data.id }}'
          timeout_seconds: 240
        mock_result:
          data:
            case_id: 00000000-0000-0000-0000-00000000c009
            operation_id: 00000000-0000-0000-0000-00000000f203
            elapsed_seconds: 30.0
            polls: 3
            operation:
              id: 00000000-0000-0000-0000-00000000f203
              action: exportResult
              status: succeeded
              percentProgress: 100
              displayName: Export of Phishing incident response
              exportFormat: pst
              exportLocation: responsiveLocations
              cloudAttachmentVersion: latest
              documentVersion: latest
              createdDateTime: '2026-11-25T09:36:00.0000000Z'
              completedDateTime: '2026-11-25T09:36:30.0000000Z'
              exportFileMetadata:
                - downloadUrl: https://contoso.example/ediscovery-exports/export-1.zip
                  fileName: export-1.zip
                  size: 5242880
          status: success
          message: ''
          operation: wait_for_operation

      - name: Record Export
        type: set_variable
        next: Cleanup Search
        vars:
          branch_outcome: exported
          action: export (PST, responsive locations)
          operation_id: '{{ vars.steps.Export_Results.data.id }}'
          export_files: "{{ (vars.steps.Wait_For_Export.data.operation.exportFileMetadata | default([], true)) | map(attribute='fileName') | join(', ') }}"
          download_url: "{{ ((vars.steps.Wait_For_Export.data.operation.exportFileMetadata | default([], true)) | first | default(none, true)).downloadUrl | default('', true) }}"

      - name: No Action
        type: set_variable
        next: Cleanup Search
        comment: >-
          The analyst chose to change nothing: the case and the search stay
          available for review in the Purview portal, and only a search this
          run created is removed again.
        vars:
          branch_outcome: no_action
          action: none
          operation_id: ''
          export_files: ''
          download_url: ''

      - name: Mark No Hits
        type: set_variable
        next: No Hits Cleanup
        comment: >-
          The estimate is done and it matched nothing: no card is sent,
          nothing is purged or exported. The zero-hit answer is itself the
          triage result - it usually means the campaign text never reached
          these mailboxes. The item counts are pinned to zero here so the
          close-out agrees with the outcome (the mailbox/site counts stay as
          the estimate reported them - an in-scope mailbox with no hits is
          the normal shape).
        vars:
          branch_outcome: no_hits
          action: none
          indexed_items: 0
          unindexed_items: 0
          total_items: 0
          operation_id: ''
          export_files: ''
          download_url: ''

      # Both cleanup steps share the guard: a search this run created is
      # removed again (the counts and the outcome are already recorded), a
      # search that existed before the run is kept. The case is always kept.
      - name: No Hits Cleanup
        type: connector
        next: Record Case File
        when: "{{ vars.search_auto_created }}"
        connector: microsoft-purview-ediscovery
        operation: delete_search
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
        mock_result:
          data:
            status_code: 204
            status: success
          status: success
          message: ''
          operation: delete_search

      - name: Cleanup Search
        type: connector
        next: Record Case File
        when: "{{ vars.search_auto_created }}"
        connector: microsoft-purview-ediscovery
        operation: delete_search
        config: ''
        params:
          case_id: '{{ vars.case_id }}'
          search_id: '{{ vars.search_id }}'
        mock_result:
          data:
            status_code: 204
            status: success
          status: success
          message: ''
          operation: delete_search

      # The reported incident gets the outcome when the caller supplied its
      # id; without one the run's own output carries everything. Append, not
      # Replace: the run's note extends the incident's existing description
      # instead of overwriting it.
      - name: Record Case File
        type: update_record
        next: Summarize Run
        when: "{{ vars.incident_id | default('', true) | length > 0 }}"
        record: "/api/3/incidents/{{ vars.incident_id }}"
        module: incidents
        operation: Append
        fields:
          description: >-
            eDiscovery triage complete: case "{{ vars.case_name }}"
            ({{ vars.case_id }}), search "{{ vars.search_display_name }}"
            ({{ vars.search_id }}) matched {{ vars.total_items }} item(s)
            (indexed {{ vars.indexed_items }}, unindexed
            {{ vars.unindexed_items }}) across {{ vars.mailbox_count }}
            mailbox(es). Response: {{ vars.action }}.

      # The single close-out every branch reaches. Each branch leaves its
      # contribution in vars (branch_outcome, action, operation_id, export
      # metadata) on the way through, so one step can carry the whole run.
      - name: Summarize Run
        type: set_variable
        vars:
          outcome: '{{ vars.branch_outcome }}'
          case_id: '{{ vars.case_id }}'
          case_auto_created: '{{ vars.case_auto_created }}'
          search_id: '{{ vars.search_id }}'
          search_auto_created: '{{ vars.search_auto_created }}'
          action: '{{ vars.action }}'
          indexed_items: '{{ vars.indexed_items }}'
          unindexed_items: '{{ vars.unindexed_items }}'
          total_items: '{{ vars.total_items }}'
          mailboxes: '{{ vars.mailbox_count }}'
          sites: '{{ vars.site_count }}'
          operation_id: '{{ vars.operation_id }}'
          export_files: '{{ vars.export_files }}'
          download_url: '{{ vars.download_url }}'
