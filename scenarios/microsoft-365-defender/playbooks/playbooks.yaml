      - name: Responded
        type: set_variable
        comment: >-
          action_failed is the honest terminal when Defender finished the
          machine action unsuccessfully: the incident still got the record, but
          the outcome does not claim a containment that did not happen.
        vars:
          outcome: "{{ 'responded' if vars.final_status == 'Succeeded' else 'action_failed' }}"
          incident_id: "{{ vars.incident_id }}"
          device_name: "{{ vars.device_name }}"
          action_name: "{{ vars.action_name }}"
          action_id: "{{ vars.action_id }}"
          final_status: "{{ vars.final_status }}"

      - name: Close No Action
        type: set_variable
        vars:
          outcome: no_action
          incident_id: "{{ vars.incident_id }}"
          device_name: "{{ vars.device_name }}"
          action_name: ''
          action_id: ''
          final_status: ''

      - name: Close Not Onboarded
        type: set_variable
        comment: >-
          Nothing is sent to the device: Defender reports it is not onboarded,
          so an action would fail on the sensor, not on the request.
        vars:
          outcome: not_onboarded
          incident_id: "{{ vars.incident_id }}"
          device_name: "{{ vars.device_name }}"
          action_name: ''
          action_id: ''
          final_status: ''

      - name: Close No Device
        type: set_variable
        vars:
          outcome: no_device
          incident_id: "{{ vars.incident_id }}"
          device_name: ''
          action_name: ''
          action_id: ''
          final_status: ''
