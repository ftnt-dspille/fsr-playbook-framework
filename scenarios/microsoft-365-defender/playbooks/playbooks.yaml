      # The analyst gate. A plain manual_input (answered in the FortiSOAR UI
      # or through the API) keeps this scenario off any chat channel. Each
      # option is one branch; the no-action option still reaches the terminal
      # outcome through a recorded comment.
      - name: Analyst Gate
        type: manual_input
        options:
          - display: isolate
            primary: true
            next: Isolate Device
          - display: av scan
            next: Run AV Scan
          - display: collect package
            next: Collect Package
          - display: no action
            next: Record No Action
        title: "Endpoint response for Defender incident {{ vars.incident_id }} on {{ vars.device_name }}"
        description: >-
          <b>{{ vars.steps.Get_Incident.data.incidentName | default('incident', true) }}</b>
          (severity {{ vars.steps.Get_Incident.data.severity | default('unknown', true) }},
          status {{ vars.steps.Get_Incident.data.status | default('unknown', true) }}).<br>
          Device <b>{{ vars.device_name }}</b>: health
          {{ vars.steps.Get_Machine.data.healthStatus | default('unknown', true) }}, risk
          {{ vars.steps.Get_Machine.data.riskScore | default('unknown', true) }}, last seen
          {{ vars.steps.Get_Machine.data.lastSeen | default('unknown', true) }}.<br><br>
          <b>isolate</b> cuts all network traffic except the Defender channel.
          <b>av scan</b> runs a Quick Microsoft Defender Antivirus scan.
          <b>collect package</b> gathers an investigation package for download.
          <b>no action</b> leaves the device alone and records that decision.

