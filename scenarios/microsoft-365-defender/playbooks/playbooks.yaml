  # - Scenario D (Windows endpoint response) - a Defender incident names the
  #   device it fired on. The playbook pulls that device's machine record,
  #   refuses to act unless Defender reports it onboarded, and then asks an
  #   analyst which containment to apply. The chosen machine action runs, is
  #   polled to a terminal status, and the outcome is written back to the
  #   incident. --------------------------------------------------------------

  - name: Respond to Defender Endpoint Incident
    description: >-
      Endpoint response for one Microsoft 365 Defender incident: pull the
      incident, find the device in its alert evidence, confirm the device is
      onboarded to Defender for Endpoint, then let an analyst choose the
      containment. The choices are isolate the device (Full isolation: all
      traffic except the Defender cloud channel is cut), run a Quick
      antivirus scan, collect an investigation package, or no action. The
      machine action is asynchronous, so the playbook waits and polls the
      action until Defender reports a terminal status, then records the
      outcome as a comment and tag on the incident.

      Why the device comes from the incident and not from a parameter: the
      analyst is answering a detection, and the device is the one Defender
      already attached to it. Taking the device id from the alert evidence
      keeps the response on the machine the detection names.

      Why the onboarding gate: a device that is not onboarded has no sensor
      to act through, and Defender answers the action with an error that
      reads like a permissions problem. The gate reports the real state.

      Why the poll: isolation finishes in seconds, a Quick scan in about a
      minute, a package in a few minutes. The action record is the only place
      Defender reports success or failure, so the outcome is read from it.

      Inputs: incident_id (the Defender incident to respond to; default is a
      sample id). Outputs: outcome (responded, action_failed, no_action,
      not_onboarded or no_device), incident_id, device_name, action_name,
      action_id, final_status.

      Live prerequisites: the microsoft-365-defender connector (1.3.0 or
      later) configured with Application permission auth, and the Machine.*
      application roles granted (Read.All, Isolate, Scan, CollectForensics,
      RestrictExecution). The Defender for Endpoint plane must be licensed and
      the device onboarded.
    is_active: true
    debug: true
    parameters: [incident_id]
    steps:

      - name: Start
        type: start
        next: Resolve Inputs

      # Scheduled and API runs bind no parameters, so the incident resolves
      # through the same default chain as scenario B: run parameter, then a
      # top-level trigger variable, then the sanitized default.
      - name: Resolve Inputs
        type: set_variable
        next: Get Incident
        vars:
          incident_id: "{{ vars.input.params.incident_id | default(vars.incident_id, true) | default('1', true) }}"

      - name: Get Incident
        type: connector
        next: Pick Device
        comment: >-
          The full incident, alerts expanded, is what carries the device
          evidence. get_incident is read-only.
