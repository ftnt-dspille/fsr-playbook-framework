# Sample playbooks for the microsoft-graph_dev connector ("Microsoft Graph API
# (fork)", v3.1.0) -- the M365 scenario set, written in the fortinet-fortiaigate
# style: scenario-grouped YAML source of truth, compiled by build.py, with a
# mock_result on every step that would otherwise need the connector configured.
#
# Why mock_result on every connector step: a playbook whose steps all carry a
# mock_result runs end-to-end on an appliance WITHOUT this connector configured
# (`fsrpb run-playbook <name> --mock`), and offline in the framework repo's
# step-through simulator. Every mock payload is the op's raw return shape copied
# from the typed fixtures in fsr-playbook-framework
# (fsr_playbooks/connectors/typed/mocks/), wrapped in the production
# {data, status, message, operation} envelope so the playbook's
# vars.steps.<step>.data.<field> references render the same way live and under
# --mock. The payloads are sanitized synthetic shapes (all-zero tenant ids,
# @contoso.example users, RFC 5737 TEST-NET addresses); when a real capture
# lands, promote it into the mock block unchanged.
#
# Requires alongside this connector on the appliance: nothing for the mock run;
# live runs need the connector in its default config plus, per scenario, the
# Entra roles listed in the playbook description.

collection: Sample - Microsoft Graph API (fork) - 3.1.0
description: >-
  Sample playbooks for the "Microsoft Graph API (fork)" connector. If you are
  planning to use the sample playbooks in your environment, ensure that you
  clone those playbooks and move them to a different collection, since the
  sample playbook collection gets deleted during connector upgrade and delete.
visible: true
tags:
  - microsoft-graph_dev
  - Microsoft
  - security

playbooks:

  # - Scenario A - Compromised user response: a user-compromise report (or a
  #   scheduled risky-user sweep) ends with the reporter's IP blocked in Entra
  #   Conditional Access and the user's sessions revoked - after a human
  #   approves through Microsoft Teams. --------------------------------------

  - name: Respond to Compromised User Report
    description: >-
      One playbook for the "a user may be compromised" report: it checks Entra
      ID Protection for the reported account, asks a human to approve the
      response through a Microsoft Teams approval card, and on approval revokes
      the user's active sessions and blocks the reported source IP by appending
      it to an IP named location in Conditional Access. Both outcomes write a
      close-out comment on the security alert that carries the report, so the
      trail ends in the alert, not in someone's inbox.

      Why best-effort on the risky-user lookup: this connector ships for tenants
      down to M365 Business Premium, where Identity Protection is P1 - the
      riskyUsers surface can be empty or refused while the rest of the response
      still makes sense. The lookup therefore runs with errors ignored and the
      playbook ends cleanly when it returns nothing actionable.

      Inputs: approver (Teams recipient for the approval card; a conversation id
      or a user UPN the microsoft-teams connector can resolve - default
      soc-oncall@contoso.example), reported_ip (the source IP to block; default
      198.51.100.7), named_location_name (the existing IP named location the IP
      is appended to - default "Lab blocked ranges"; the op appends to an
      EXISTING location, it does not create one), alert_id (the Graph security
      alerts_v2 id to comment on - default is the sample alert id). Outputs:
      outcome (contained, contained_no_block, not_approved or no_action_taken),
      risk_user, revoked, blocked_ip, named_location.

      Live prerequisites: the connector's app registration needs
      User.RevokeSessions.All, IdentityRiskyUser.Read.All (P1) and
      Policy.Read.All plus ConditionalAccess... (the ipNamedLocation PATCH is
      covered by Policy.Read.All) - and the IP named location must already
      exist. Run it from a schedule for the sweep variant, or from the Execute
      menu with the report details.
    is_active: true
    debug: true
    parameters: [approver, reported_ip, named_location_name, alert_id]
    steps:

      - name: Start
        type: start
        next: Resolve Inputs

      # Scheduled runs bind no playbook parameters, so every input resolves
      # through a default chain: manual/API-run parameter -> top-level trigger
      # variable -> the sanitized default.
      - name: Resolve Inputs
        type: set_variable
        next: List Risky Users
        vars:
          approver: "{{ vars.input.params.approver | default(vars.approver, true) | default('soc-oncall@contoso.example', true) }}"
          reported_ip: "{{ vars.input.params.reported_ip | default(vars.reported_ip, true) | default('198.51.100.7', true) }}"
          named_location_name: "{{ vars.input.params.named_location_name | default(vars.named_location_name, true) | default('Lab blocked ranges', true) }}"
          alert_id: "{{ vars.input.params.alert_id | default(vars.alert_id, true) | default('00000000-0000-0000-0000-000000000b01', true) }}"

      # Best-effort on a P1 tenant: Identity Protection may have nothing or the
      # app may lack the scope - neither should stop the response.
      - name: List Risky Users
        type: connector
        next: Risky Users Found
        comment: >-
          Best-effort by design: ignore_errors keeps the run alive when the
          tenant answers 403/404 for identityProtection (no P1 license, missing
          scope) - the decision below treats that as "nothing actionable".
        connector: microsoft-graph_dev
        operation: get_risky_users_list
        config: ''
        params: {}
        ignore_errors: true
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#identityProtection/riskyUsers"
            value:
              - id: 00000000-0000-0000-0000-000000000001
                userPrincipalName: alice@contoso.example
                userDisplayName: Alice Chen
                isDeleted: false
                isProcessing: false
                riskLevel: medium
                riskState: atRisk
                riskDetail: none
                riskLastUpdatedDateTime: '2026-01-15T08:15:00Z'
          status: success
          message: ''
          operation: get_risky_users_list

      - name: Risky Users Found
        type: decision
        conditions:
          - display: At-risk users found
            when: "{{ (vars.steps.List_Risky_Users.data.value | default([], true)) | selectattr('riskState', 'equalto', 'atRisk') | list | length > 0 }}"
            next: Pick Risky User
          - display: Nothing actionable
            default: true
            next: No Action

      - name: Pick Risky User
        type: set_variable
        next: Approval
        comment: >-
          The sweep can return several at-risk users; the approval card names
          the first one and the response targets exactly that account. A report
          about a specific user passes that user in the report and the sweep
          confirms it is flagged.
        vars:
          risk_user: "{{ ((vars.steps.List_Risky_Users.data.value | default([], true)) | selectattr('riskState', 'equalto', 'atRisk') | list | first | default(none, true)).userPrincipalName | default('unknown@contoso.example', true) }}"
          risk_level: "{{ ((vars.steps.List_Risky_Users.data.value | default([], true)) | selectattr('riskState', 'equalto', 'atRisk') | list | first | default(none, true)).riskLevel | default('unknown', true) }}"
          risk_summary: >-
            {{ ((vars.steps.List_Risky_Users.data.value | default([], true)) | selectattr('riskState', 'equalto', 'atRisk') | list | first | default(none, true)).userPrincipalName | default('the reported user', true) }}
            is flagged atRisk (risk level
            {{ ((vars.steps.List_Risky_Users.data.value | default([], true)) | selectattr('riskState', 'equalto', 'atRisk') | list | first | default(none, true)).riskLevel | default('unknown', true) }})
            in Entra ID Protection.

      # The approval is the tier gate: session revocation and Conditional
      # Access changes are destructive enough to want a person. The card is
      # delivered through the "Microsoft Teams" external channel; the
      # conversation is resolved from the approver parameter (the same wiring
      # the FortiSOAR-for-Microsoft-Teams solution pack uses, where
      # owner_detail.externalRecipients carries the conversation). The channel
      # picklist IRI is tenant-local, so it is selected on the prompt after
      # cloning - the approve/reject routing itself is channel-agnostic (the
      # button's step_iri carries the decision).
      - name: Approval
        type: manual_input
        options:
          - display: approve
            primary: true
            next: Revoke Sessions
          - display: reject
            next: Close Out Rejected
        title: "Approve compromised-user response for {{ vars.risk_user }}?"
        description: >-
          {{ vars.risk_summary }}<br><br>On <b>approve</b>: revoke all active
          sessions for {{ vars.risk_user }} and block {{ vars.reported_ip }} by
          appending it to the Conditional Access IP named location
          "{{ vars.named_location_name }}". On <b>reject</b>: nothing is
          changed and the alert is closed out with a note that the response was
          not approved.
        owner_detail:
          isAssigned: false
          externalRecipients: "{{ vars.approver }}"
        inputInternalUsers: true
        inline_channel_list:
          # External Channel picklist item "Microsoft Teams" - the platform-
          # seeded UUID the Teams connector's own playbooks and solution pack
          # ship, kept here so a clone delivers to Teams out of the box.
          - /api/3/picklists/c7c35e25-9c26-4a43-a984-4f57d2027111
        unauthenticated_input: true

      - name: Revoke Sessions
        type: connector
        next: Find Named Location
        comment: >-
          revokeSignInSessions kills every refresh/access token issued so far;
          the user must re-authenticate, which evicts an attacker holding a
          stolen session cookie.
        connector: microsoft-graph_dev
        operation: revoke_user_sessions
        config: ''
        params:
          user: '{{ vars.risk_user }}'
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#Edm.Boolean"
            value: true
          status: success
          message: ''
          operation: revoke_user_sessions

      # block_new_ips appends to an EXISTING IP named location, so resolve it
      # by name first. The @odata.type filter matters live: a country named
      # location with the same display name would fail the PATCH with "not of
      # type IP ranges" - refuse it here instead, with a readable outcome.
      - name: Find Named Location
        type: connector
        next: Named Location Found
        connector: microsoft-graph_dev
        operation: get_all_named_locations
        config: ''
        params:
          name: '{{ vars.named_location_name }}'
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#identity/conditionalAccess/namedLocations"
            value:
              - "@odata.type": "#microsoft.graph.ipNamedLocation"
                id: 00000000-0000-0000-0000-000000000f01
                displayName: Lab blocked ranges
                modifiedDateTime: '2026-01-15T07:00:00Z'
                createdDateTime: '2026-01-10T07:00:00Z'
                isTrusted: false
                ipRanges:
                  - "@odata.type": "#microsoft.graph.iPv4CidrRange"
                    cidrAddress: 192.0.2.0/24
                  - "@odata.type": "#microsoft.graph.iPv6CidrRange"
                    cidrAddress: 2001:db8::/48
              - "@odata.type": "#microsoft.graph.countryNamedLocation"
                id: 00000000-0000-0000-0000-000000000f02
                displayName: Allowed countries
                modifiedDateTime: '2026-01-12T07:00:00Z'
                createdDateTime: '2026-01-12T07:00:00Z'
                isTrusted: true
                includeUnknownCountriesAndRegions: false
                countryLookupMethod: clientIp
                countriesAndRegions: [US, CA]
          status: success
          message: ''
          operation: get_all_named_locations

      - name: Named Location Found
        type: decision
        conditions:
          - display: IP named location found
            when: "{{ (vars.steps.Find_Named_Location.data.value | default([], true)) | selectattr('ipRanges', 'defined') | list | length > 0 }}"
            next: Block IPs
          - display: Named location missing or not an IP location
            default: true
            next: Close Out No Block

      - name: Block IPs
        type: connector
        next: Close Out Blocked
        comment: >-
          Appends the reported IP to the named location's ipRanges - existing
          ranges are preserved, so repeated reports accumulate in one location.
        connector: microsoft-graph_dev
        operation: block_new_ips
        config: ''
        params:
          namedLocationUuid: "{{ ((vars.steps.Find_Named_Location.data.value | default([], true)) | selectattr('ipRanges', 'defined') | list | first | default(none, true)).id | default('', true) }}"
          ipv4_ips: '{{ vars.reported_ip }}'
          ipv6_ips: ''
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#identity/conditionalAccess/namedLocations/$entity"
            "@odata.type": "#microsoft.graph.ipNamedLocation"
            id: 00000000-0000-0000-0000-000000000f01
            displayName: Lab blocked ranges
            createdDateTime: '2026-01-10T07:00:00Z'
            modifiedDateTime: '2026-01-15T10:00:00Z'
            isTrusted: false
            ipRanges:
              - "@odata.type": "#microsoft.graph.iPv4CidrRange"
                cidrAddress: 192.0.2.0/24
              - "@odata.type": "#microsoft.graph.iPv4CidrRange"
                cidrAddress: 198.51.100.0/24
          status: success
          message: ''
          operation: block_new_ips

      # Close-out comments go on the Graph security alert that carries the
      # report; both approval outcomes comment, so the alert trail never ends
      # in silence.
      - name: Close Out Blocked
        type: connector
        next: Contained
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Compromised-user response (approved): revoked all active sessions
            for {{ vars.risk_user }} (risk level {{ vars.risk_level }}) and
            blocked {{ vars.reported_ip }} by appending it to the Conditional
            Access IP named location "{{ vars.named_location_name }}".
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Compromised-user response (approved): revoked all active
                  sessions for alice@contoso.example (risk level medium) and
                  blocked 198.51.100.7 by appending it to the Conditional
                  Access IP named location "Lab blocked ranges".
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:40:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Close Out No Block
        type: connector
        next: Contained No Block
        comment: >-
          The no-block branch still comments: sessions were revoked (the
          containment that matters most), but the IP could not be blocked and a
          human should create or fix the named location.
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Compromised-user response (approved, block skipped): revoked all
            active sessions for {{ vars.risk_user }} (risk level
            {{ vars.risk_level }}). {{ vars.reported_ip }} was NOT blocked -
            no IP named location named "{{ vars.named_location_name }}" exists
            (or the match is not an IP location); create it and re-run to
            block the IP.
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Compromised-user response (approved, block skipped): revoked
                  all active sessions for alice@contoso.example (risk level
                  medium). 198.51.100.7 was NOT blocked - no IP named location
                  named "Lab blocked ranges" exists (or the match is not an IP
                  location); create it and re-run to block the IP.
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:41:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Close Out Rejected
        type: connector
        next: Not Approved
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Compromised-user response REJECTED at approval: sessions for
            {{ vars.risk_user }} were NOT revoked and {{ vars.reported_ip }}
            was NOT blocked. The report stays with the analyst for follow-up.
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Compromised-user response REJECTED at approval: sessions for
                  alice@contoso.example were NOT revoked and 198.51.100.7 was
                  NOT blocked. The report stays with the analyst for follow-up.
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:42:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Contained
        type: set_variable
        vars:
          outcome: contained
          risk_user: '{{ vars.risk_user }}'
          revoked: '{{ vars.steps.Revoke_Sessions.data.value }}'
          blocked_ip: '{{ vars.reported_ip }}'
          named_location: "{{ vars.steps.Block_IPs.data.displayName | default(vars.named_location_name, true) }}"

      - name: Contained No Block
        type: set_variable
        comment: >-
          Same containment minus the IP block: the close-out comment carries
          the "why" for the auditor.
        vars:
          outcome: contained_no_block
          risk_user: '{{ vars.risk_user }}'
          revoked: '{{ vars.steps.Revoke_Sessions.data.value }}'
          blocked_ip: ''
          named_location: ''

      - name: Not Approved
        type: set_variable
        vars:
          outcome: not_approved
          risk_user: '{{ vars.risk_user }}'
          revoked: false
          blocked_ip: ''

      - name: No Action
        type: set_variable
        comment: >-
          Reached when the risky-user sweep returned nothing at risk (or the
          lookup itself was refused on this tenant) - a clean no-op, not a
          failure.
        vars:
          outcome: no_action_taken
          risk_user: ''
          revoked: false
          blocked_ip: ''

  # - Scenario C - Phishing mail purge: one reported subject, every mailbox
  #   that still holds it, one approval, one threaded delete per user, one
  #   close-out comment. ------------------------------------------------------

  - name: Purge Reported Phishing Mail
    description: >-
      Removes a reported phishing message from every mailbox the reporter
      listed. search_message looks the subject up per user, the run pauses for
      an approval card in Microsoft Teams showing exactly how many messages
      matched, and on approval del_message_bulk deletes the matched messages
      per user (the op's own thread pool deletes them in parallel). A close-out
      comment on the reported alert records how many deletions succeeded and
      how many failed, so a partial purge is visible instead of silent.

      The matched-message list is built by a small Python snippet (the
      connector's del_message_bulk wants {user_id, message_id} pairs and the
      search result pages carry them one level apart). A page that answered
      with a Graph error body instead of a message list is skipped, not fatal -
      one broken mailbox must not stop the purge of the others.

      Inputs: approver (Teams recipient for the approval card - default
      soc-oncall@contoso.example), phishing_subject (the exact subject to
      match; the op filters on subject eq), user_list (comma-separated UPNs to
      sweep - default alice@contoso.example, bob@contoso.example), alert_id
      (the Graph security alerts_v2 id to comment on). Outputs: outcome
      (purged, purged_with_errors, not_approved or no_mail_found),
      deleted_count, error_count, targets.

      Live prerequisites: Mail.Read (search) plus Mail.ReadWrite (delete) on
      the mailboxes in user_list - application permissions with an
      application access policy, or delegated with consent per mailbox.
    is_active: true
    debug: true
    parameters: [approver, phishing_subject, user_list, alert_id]
    steps:

      - name: Start
        type: start
        next: Resolve Inputs

      - name: Resolve Inputs
        type: set_variable
        next: Search Mail
        vars:
          approver: "{{ vars.input.params.approver | default(vars.approver, true) | default('soc-oncall@contoso.example', true) }}"
          phishing_subject: "{{ vars.input.params.phishing_subject | default(vars.phishing_subject, true) | default('Action required: payroll update', true) }}"
          user_list: "{{ vars.input.params.user_list | default(vars.user_list, true) | default('alice@contoso.example, bob@contoso.example', true) }}"
          alert_id: "{{ vars.input.params.alert_id | default(vars.alert_id, true) | default('00000000-0000-0000-0000-000000000b01', true) }}"

      - name: Search Mail
        type: connector
        next: Messages Found
        comment: >-
          One threaded search per user in user_list; the op aggregates the
          pages into Message_Found_List / Message_Not_Found_List (a page that
          errored lands in the not-found list as an error body). Size caps the
          per-user page so one hoarded mailbox cannot flood the run.
        connector: microsoft-graph_dev
        operation: search_message
        config: ''
        params:
          subject: '{{ vars.phishing_subject }}'
          user_list: '{{ vars.user_list }}'
          size: 50
        mock_result:
          data:
            Message_Found_List:
              - "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#users('00000000-0000-0000-0000-000000000001')/messages(subject)"
                value:
                  - "@odata.etag": 'W/"CQAAABYAAAA="'
                    id: AAMkAGI1AAA=
                    createdDateTime: '2026-01-15T08:00:00Z'
                    lastModifiedDateTime: '2026-01-15T08:00:00Z'
                    changeKey: CQAAABYAAAA=
                    categories: []
                    receivedDateTime: '2026-01-15T08:00:00Z'
                    sentDateTime: '2026-01-15T08:00:00Z'
                    hasAttachments: true
                    internetMessageId: <synthetic-1@contoso.example>
                    subject: 'Action required: payroll update'
                    bodyPreview: Confirm your payroll details before the cycle closes.
                    importance: normal
                    parentFolderId: AAMkAGI1AAA=
                    conversationId: AAQkAGI1AAA=
                    conversationIndex: AQHZA=
                    isDeliveryReceiptRequested: false
                    isReadReceiptRequested: false
                    isRead: false
                    isDraft: false
                    webLink: https://outlook.office365.com/owa/?ItemID=AAMkAGI1AAA%3D
                    inferenceClassification: focused
                    body:
                      contentType: html
                      content: <html><body>Confirm your payroll details before the cycle closes.</body></html>
                    sender:
                      emailAddress:
                        name: Cara Nunes
                        address: cara@contoso.example
                    from:
                      emailAddress:
                        name: Cara Nunes
                        address: cara@contoso.example
                    toRecipients:
                      - emailAddress:
                          name: Alice Chen
                          address: alice@contoso.example
                    ccRecipients: []
                    bccRecipients: []
                    replyTo: []
                    flag:
                      flagStatus: notFlagged
                user_id: 00000000-0000-0000-0000-000000000001
              - "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#users('00000000-0000-0000-0000-000000000002')/messages(subject)"
                value:
                  - "@odata.etag": 'W/"CQAAABYAAAA="'
                    id: AAMkAGI2AAA=
                    createdDateTime: '2026-01-15T08:05:00Z'
                    lastModifiedDateTime: '2026-01-15T08:05:00Z'
                    changeKey: CQAAABYAAAA=
                    categories: []
                    receivedDateTime: '2026-01-15T08:05:00Z'
                    sentDateTime: '2026-01-15T08:05:00Z'
                    hasAttachments: true
                    internetMessageId: <synthetic-2@contoso.example>
                    subject: 'Action required: payroll update'
                    bodyPreview: Confirm your payroll details before the cycle closes.
                    importance: normal
                    parentFolderId: AAMkAGI2AAA=
                    conversationId: AAQkAGI2AAA=
                    conversationIndex: AQHZB=
                    isDeliveryReceiptRequested: false
                    isReadReceiptRequested: false
                    isRead: false
                    isDraft: false
                    webLink: https://outlook.office365.com/owa/?ItemID=AAMkAGI2AAA%3D
                    inferenceClassification: focused
                    body:
                      contentType: html
                      content: <html><body>Confirm your payroll details before the cycle closes.</body></html>
                    sender:
                      emailAddress:
                        name: Cara Nunes
                        address: cara@contoso.example
                    from:
                      emailAddress:
                        name: Cara Nunes
                        address: cara@contoso.example
                    toRecipients:
                      - emailAddress:
                          name: Bob Tester
                          address: bob@contoso.example
                    ccRecipients: []
                    bccRecipients: []
                    replyTo: []
                    flag:
                      flagStatus: notFlagged
                user_id: 00000000-0000-0000-0000-000000000002
            Message_Not_Found_List: []
            Run_Time: 1.23
            Total_Users_Processed: 2
          status: success
          message: ''
          operation: search_message

      - name: Messages Found
        type: decision
        conditions:
          - display: Matched messages found
            when: "{{ (vars.steps.Search_Mail.data.Message_Found_List | default([], true)) | map(attribute='value') | map('default', [], true) | sum(start=[]) | length > 0 }}"
            next: Build Delete Targets
          - display: No matched mail
            default: true
            next: No Mail Found

      # The connector's del_message_bulk wants {user_id, message_id} pairs and
      # the search result carries them one level apart (page user_id, message
      # ids inside value). The snippet body is itself a Jinja template, so the
      # template's for-loops EMIT one Python append per matched message - no
      # imports (the code-snippet sandbox ships with imports disabled), no
      # banned names, and string-only | tojson injections (a whole-page tojson
      # would put lowercase true/false into the Python source, which the
      # sandbox rejects as names).
      - name: Build Delete Targets
        type: code_snippet
        next: Approval
        code: |
          targets = []
          {%- for page in vars.steps.Search_Mail.data.Message_Found_List | default([], true) -%}
          {%- for message in page.value | default([], true) -%}
          targets.append({"user_id": {{ page.user_id | tojson }}, "message_id": {{ message.id | tojson }}})
          {%- endfor -%}
          {%- endfor -%}
          print({"targets": targets, "found": len(targets)})
        mock_result:
          data:
            code_output:
              targets:
                - user_id: 00000000-0000-0000-0000-000000000001
                  message_id: AAMkAGI1AAA=
                - user_id: 00000000-0000-0000-0000-000000000002
                  message_id: AAMkAGI2AAA=
              found: 2

      - name: Approval
        type: manual_input
        options:
          - display: approve
            primary: true
            next: Prepare Targets
          - display: reject
            next: Reject Comment
        title: "Approve purge of '{{ vars.phishing_subject }}' mail?"
        description: >-
          The subject search matched messages in
          {{ vars.steps.Search_Mail.data.Total_Users_Processed | default(0, true) }}
          mailbox(es) reported for the sweep. On <b>approve</b> the matched
          messages are deleted per user with del_message_bulk (each deleted
          message stays recoverable in the mailbox's Deleted Items). On
          <b>reject</b> nothing is deleted and the alert records that the purge
          was not approved.
        owner_detail:
          isAssigned: false
          externalRecipients: "{{ vars.approver }}"
        inputInternalUsers: true
        inline_channel_list:
          - /api/3/picklists/c7c35e25-9c26-4a43-a984-4f57d2027111
        unauthenticated_input: true

      # The runtime wraps code_snippet output as {data: {code_output: ...}}
      # in production, and --mock returns this step's mock_result verbatim
      # (which carries the same {data: {code_output: ...}} shape), so one
      # reference style reads the targets in both modes.
      - name: Prepare Targets
        type: set_variable
        next: Purge Mail
        vars:
          purge_targets: "{{ vars.steps.Build_Delete_Targets.data.code_output.targets }}"
          found_count: "{{ vars.steps.Build_Delete_Targets.data.code_output.found | default(0, true) }}"

      - name: Purge Mail
        type: connector
        next: Purge Checked
        comment: >-
          One call per run: the op's own thread pool fans the pair list out per
          user, so "per user" is the op's job, not a loop here. Results are
          checked afterwards because a 404 (the copy was already gone - auto
          purge, user action) is a NORMAL outcome for phishing sweeps and must
          not fail the run.
        connector: microsoft-graph_dev
        operation: del_message_bulk
        config: ''
        params:
          user_list: '{{ vars.purge_targets }}'
        ignore_errors: true
        mock_result:
          data:
            Message_Deleted_List:
              - msg_deleted: 'Yes'
                user_id:
                  user_id: 00000000-0000-0000-0000-000000000001
                  message_id: AAMkAGI1AAA=
            Error_List:
              - error_msg: 404
                user_id:
                  user_id: 00000000-0000-0000-0000-000000000002
                  message_id: AAMkAGI2AAA=
            Run_Time: 0.87
            Total_Users_Processed: 2
          status: success
          message: ''
          operation: del_message_bulk

      - name: Purge Checked
        type: decision
        conditions:
          - display: All deletions succeeded
            when: "{{ (vars.steps.Purge_Mail.data.Error_List | default([], true)) | length == 0 }}"
            next: Close Out Purged
          - display: Some deletions failed
            default: true
            next: Close Out Partial

      - name: Close Out Purged
        type: connector
        next: Purged
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Phishing mail purge (approved): deleted
            {{ (vars.steps.Purge_Mail.data.Message_Deleted_List | default([], true)) | length }}
            message(s) matching "{{ vars.phishing_subject }}" across
            {{ vars.found_count }} matched message(s); 0 deletions failed.
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Phishing mail purge (approved): deleted 1 message(s)
                  matching "Action required: payroll update" across 2 matched
                  message(s); 0 deletions failed.
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:50:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Close Out Partial
        type: connector
        next: Purged With Errors
        comment: >-
          A partial purge is still a purge - the comment says exactly which
          deletions failed so a human can chase the stragglers (usually copies
          that were already gone).
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Phishing mail purge (approved, partial): deleted
            {{ (vars.steps.Purge_Mail.data.Message_Deleted_List | default([], true)) | length }}
            message(s) matching "{{ vars.phishing_subject }}";
            {{ (vars.steps.Purge_Mail.data.Error_List | default([], true)) | length }}
            deletion(s) failed and need follow-up (typically already-purged
            copies answering 404).
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Phishing mail purge (approved, partial): deleted 1
                  message(s) matching "Action required: payroll update"; 1
                  deletion(s) failed and need follow-up (typically
                  already-purged copies answering 404).
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:51:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Reject Comment
        type: connector
        next: Not Approved
        connector: microsoft-graph_dev
        operation: add_comment_on_security_alert
        config: ''
        params:
          alert_id: '{{ vars.alert_id }}'
          comment: >-
            Phishing mail purge REJECTED at approval: no mail matching
            "{{ vars.phishing_subject }}" was deleted. The report stays with
            the analyst for follow-up.
        mock_result:
          data:
            "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#security#security/alerts_v2('00000000-0000-0000-0000-000000000b01')/comments"
            value:
              - comment: >-
                  Phishing mail purge REJECTED at approval: no mail matching
                  "Action required: payroll update" was deleted. The report
                  stays with the analyst for follow-up.
                createdByDisplayName: FortiSOAR
                createdDateTime: '2026-01-15T09:52:00Z'
          status: success
          message: ''
          operation: add_comment_on_security_alert

      - name: Purged
        type: set_variable
        vars:
          outcome: purged
          deleted_count: "{{ (vars.steps.Purge_Mail.data.Message_Deleted_List | default([], true)) | length }}"
          error_count: 0
          targets: '{{ vars.purge_targets }}'

      - name: Purged With Errors
        type: set_variable
        vars:
          outcome: purged_with_errors
          deleted_count: "{{ (vars.steps.Purge_Mail.data.Message_Deleted_List | default([], true)) | length }}"
          error_count: "{{ (vars.steps.Purge_Mail.data.Error_List | default([], true)) | length }}"
          targets: '{{ vars.purge_targets }}'

      - name: Not Approved
        type: set_variable
        vars:
          outcome: not_approved
          deleted_count: 0
          error_count: 0
          targets: []

      - name: No Mail Found
        type: set_variable
        comment: >-
          Nothing matched the subject in any reported mailbox - the sweep ran,
          the answer is "already gone", and the alert says so through the run
          outcome rather than a comment.
        vars:
          outcome: no_mail_found
          deleted_count: 0
          error_count: 0
          targets: []
