# find_record + update_record — the canonical "look something up, mutate it"
# pattern. Most ingestion playbooks look like this.
#
# `find_record` (handler `find_data`):
#   module: target module name (alerts, incidents, indicators, etc.)
#   query: filter spec; supports `eq`, `contains`, `in`, etc.
#   partial: when true, returns first page only
#
# `update_record` (handler `update_data`):
#   module:   target module name (alerts, incidents, indicators, ...)
#   record:   IRI of the record to update (for a targeted update); omitted for
#             the bulk `__bulk` path FSR adds at runtime
#   fields:   dict of {field: new_value} to set on the matched record(s)

collection: Compiler Examples
description: find + update pattern.
visible: true

playbooks:
  - name: Tag Existing Indicator
    description: Look up an indicator by value and tag it.
    parameters:
      - indicator_value
      - tag
    steps:
      - name: start
        type: start
        next: find

      - name: find
        type: find_record
        next: Apply tag
        module: indicators
        filters:
          - field: value
            operator: eq
            value: "{{ vars.input.params.indicator_value }}"
        partial: true

      - name: Apply tag
        type: update_record
        module: indicators
        fields:
          tags: "{{ vars.steps.find['hydra:member'][0].tags + [vars.input.params.tag] }}"