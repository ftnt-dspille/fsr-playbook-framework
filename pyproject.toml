[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
# This is the DEV project: the `fsrpb` CLI + tooling. The PUBLISHED library is a
# separate dist built from packaging/fsr_playbooks. Keep the names distinct --
# calling this one `fsr_playbooks` makes an editable checkout answer
# `importlib.metadata.version("fsr-playbooks")`, so a dev laptop impersonates the
# wheel the connector pins.
#
# The version is NOT hardcoded, for the same reason it isn't over in
# packaging/fsr_playbooks: `fsr_playbooks/__init__.py` resolves `__version__` by
# trying ("fsr-playbooks", "fsr_playbooks", "fsrpb"), and on a dev checkout only
# THIS dist is installed -- so whatever is written here becomes the framework's
# reported version, and `version_is_known()` returns True for it. A literal
# ("0.0.1", or a hand-typed "0.6.17") therefore makes `__version__` a string a
# human last remembered to retype: it reads correct until the next tag, then
# silently lies. That is the cwd-dependent-version failure the 30-line comment
# in __init__.py exists to prevent and `make doctor` [0/5] was built to catch.
#
# setuptools-scm reads the same git tag hatch-vcs stamps into the real wheel
# (hatch-vcs wraps setuptools-scm), with the same `no-guess-dev` scheme, so a
# dev checkout and a release build report identically and neither can drift.
name = "fsrpb"
dynamic = ["version"]
description = "FortiSOAR Playbook YAML compiler + reference store"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "pydantic>=2",
    # Local sibling repo. The floor is NOT decorative: the connector declares
    # `pyfsr>=0.7.9`, and modules added after that (e.g. `pyfsr.config`) are
    # imported by tooling here. This used to be a bare "pyfsr" with the editable
    # install expressed only as a COMMENT -- a comment is not a constraint, so
    # the resolver was free to take pyfsr 0.2.2 off PyPI, which it did. That
    # build predated `pyfsr.config` and broke collection of the offline suite.
    # The floor + [tool.uv.sources] below make the intent machine-enforced.
    "pyfsr>=0.7.9",
    "mcp>=1.0",
]

[project.scripts]
# `fsrpb_main` (repo-root shim) bootstraps tooling/ onto sys.path, then calls
# cli.main -- cli.py is NOT an installed package so it can't be the entry directly.
fsrpb = "fsrpb_main:main"

[dependency-groups]
# Typing audit tooling (TYPING_GAP_IDENTIFICATION_PLAN). `uv sync --group typing`.
typing = ["mypy>=2.1"]

[tool.setuptools_scm]
# `.git` is at this pyproject's own directory, so no `root` override is needed
# (unlike packaging/fsr_playbooks, which sits two levels down and sets
# root = "../.."). `no-guess-dev` matches that sibling and pyfsr, so an untagged
# commit reads `0.6.18.post1.devN+g<sha>` in both places rather than optimistically
# guessing the NEXT release -- a dev checkout must never claim to be 0.6.19.
version_scheme = "no-guess-dev"

[tool.setuptools]
# fsr_playbooks lives at the repo root; non-shipped tooling lives under tooling/.
package-dir = {"" = ".", "probes" = "tooling/probes", "store" = "tooling/store", "e2e" = "tooling/e2e"}
py-modules = ["fsrpb_main"]
packages = [
    "probes", "store", "e2e",
    "fsr_playbooks",
    "fsr_playbooks.compiler", "fsr_playbooks.compiler.resolver", "fsr_playbooks.compiler.rulesets",
    "fsr_playbooks.compiler.typed_args", "fsr_playbooks.compiler.typed_args.steps",
    "fsr_playbooks.mcp_server",
    "fsr_playbooks.llm",
    "fsr_playbooks.agent",
    "fsr_playbooks.helpers",
]

[tool.ruff]
# Lint at the supported floor (requires-python >=3.10) so version-specific
# lints (e.g. pyupgrade rewrites) target the lowest runtime we ship to.
target-version = "py310"
extend-exclude = ["web/frontend", "store", ".venv", "tooling/scratch"]

[tool.ruff.lint]
# Pyflakes (F) + pyupgrade (UP) + isort (I). Broaden further (E/B) in a
# follow-up sweep.
select = ["F", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export submodule symbols (and, in mcp_server,
# import tool modules purely to register their @mcp.tool decorators). The
# "unused import" is the intended public surface / registration side effect.
"**/__init__.py" = ["F401"]

# B023 (function-uses-loop-variable): all 37 findings are false positives --
# each closure/lambda is called immediately within the same loop iteration
# (re.sub replacement, asyncio.gather, set comprehension, direct yield), never
# deferred. Triaged under #108; annotate any future real bug with `# noqa: B023`
# rather than broadening this ignore.
"fsr_playbooks/compiler/connector_output_refs.py" = ["B023"]
"fsr_playbooks/compiler/visual_model.py" = ["B023"]
"fsr_playbooks/compiler/parser.py" = ["B023"]
"fsr_playbooks/compiler/resolver/rewriters.py" = ["B023"]
"fsr_playbooks/llm/openai_provider.py" = ["B023"]
"fsr_playbooks/llm/anthropic_provider.py" = ["B023"]
"fsr_playbooks/mcp_server/_shared.py" = ["B023"]
"fsr_playbooks/mcp_server/tools_analysis.py" = ["B023"]

# Typing audit (TYPING_GAP_IDENTIFICATION_PLAN). The compiler/ scope is a
# clean mypy gate (0 errors). The llm/ + mcp_server/ scopes use a ratchet
# baseline (docs/typing/mypy_ratchet.json) enforced by `make mypy-gate` --
# fails on NEW errors, passes at or below the committed floor.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
# Deliberately NOT strict yet -- default checks surface the high-signal
# union-attr / index / arg-type bugs without drowning in `Any` noise.
files = ["fsr_playbooks/compiler"]

[tool.uv.sources]
# Resolve pyfsr from the sibling checkout, editable -- the setup this repo has
# always assumed but never declared. Without it `uv sync` silently pulls an old
# PyPI build instead (see the dependency comment above).
pyfsr = { path = "../pyfsr", editable = true }
